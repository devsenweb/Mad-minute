name: Build Mad Minute APK
on:
  push:
    branches: [main]
    # index.html-only changes don't need a new APK; the app downloads them itself.
    paths: ['**', '!app/src/main/assets/**', '!**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-34 build-tools;34.0.0' }
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: MadMinute-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      # Stable download link for the phone:
      # https://github.com/devsenweb/mad-minute/releases/download/latest/MadMinute.apk
      - name: Publish to the "latest" release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MadMinute.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MadMinute.apk --target "$GITHUB_SHA" --prerelease \
            --title "Mad Minute (latest build)" --notes "Open on the Android phone and tap MadMinute.apk to install."
